<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUGA — Consola de Seguridad</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#F6F8FC;--surface:#FFFFFF;--border:#E4E9F2;--ink:#111725;--muted:#5B6675;
--accent:#5B3DF5;--accent-light:#EEF0FE;
--critical:#E5322D;--high:#F59E0B;--medium:#EAB308;--low:#64748B;--ok:#0FA968;--danger:#E5322D;
--firestore:#6D3BEB;--rtdb:#0EA5E9;--supabase:#EC4899;
--radius:14px;--radius-sm:8px;
--shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.06);
--shadow-lg:0 4px 24px rgba(0,0,0,.08);
--font-title:'Space Grotesk',sans-serif;
--font-body:'Inter',sans-serif;
--font-mono:'JetBrains Mono',monospace;
}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:inherit}
h1,h2,h3,h4{font-family:var(--font-title);font-weight:600}
code,pre{font-family:var(--font-mono);font-size:.88rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}

/* LOGIN */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bg) 0%,var(--accent-light) 100%);padding:24px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);width:100%;max-width:420px;padding:40px 36px}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:24px;justify-content:center}
.login-logo svg{width:32px;height:32px}
.login-logo span{font-family:var(--font-title);font-size:1.5rem;font-weight:700;color:var(--ink)}
.login-title{text-align:center;font-size:1.15rem;color:var(--ink);margin-bottom:28px;font-weight:500}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:.82rem;font-weight:500;color:var(--muted);margin-bottom:6px}
.login-field input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.93rem;transition:border .2s}
.login-field input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-light)}
.btn-primary{display:block;width:100%;padding:12px;background:var(--accent);color:#fff;border-radius:var(--radius-sm);font-weight:600;font-size:.95rem;transition:background .2s,transform .1s}
.btn-primary:hover{background:#4A2FD4}
.btn-primary:active{transform:scale(.98)}
.login-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:.82rem}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.btn-social{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.88rem;font-weight:500;margin-bottom:10px;transition:background .15s,border .15s}
.btn-social:hover{background:var(--accent-light);border-color:var(--accent)}
.btn-social svg{width:18px;height:18px}
.login-demo{display:block;text-align:center;margin-top:18px;font-size:.85rem;color:var(--accent);font-weight:500}
.login-demo:hover{text-decoration:underline}
.login-value{position:absolute;left:0;top:0;width:50%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:48px;background:linear-gradient(135deg,#5B3DF5 0%,#3B1FC5 100%);color:#fff;border-radius:var(--radius) 0 0 var(--radius)}
@media(max-width:900px){.login-value{display:none}}
/* ── Auth (Supabase) ── */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
@media(max-width:920px){.login-wrap{grid-template-columns:1fr}}
.login-hero{background:linear-gradient(150deg,#5B3DF5 0%,#3B1FC5 58%,#2A128F 100%);color:#fff;padding:56px 52px;display:flex;flex-direction:column;justify-content:center;gap:22px;position:relative;overflow:hidden}
.login-hero::after{content:'';position:absolute;right:-90px;bottom:-90px;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.07)}
@media(max-width:920px){.login-hero{display:none}}
.login-hero-logo{display:flex;align-items:center;gap:10px}
.login-hero-logo svg{width:30px;height:30px}
.login-hero-logo span{font-family:var(--font-title);font-weight:700;font-size:1.35rem;letter-spacing:-.01em}
.login-hero h1{font-family:var(--font-title);font-size:2.1rem;line-height:1.18;font-weight:700;max-width:15ch}
.login-hero .lead{opacity:.88;font-size:1rem;line-height:1.6;max-width:36ch}
.login-hero ul{list-style:none;display:flex;flex-direction:column;gap:13px;margin-top:4px;position:relative;z-index:1}
.login-hero li{display:flex;gap:11px;align-items:flex-start;font-size:.92rem;line-height:1.45;opacity:.94}
.login-hero li svg{width:18px;height:18px;flex:none;margin-top:1px}
.login-panel{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--surface)}
.login-inner{width:100%;max-width:390px}
.auth-tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;margin-bottom:22px}
.auth-tab{flex:1;padding:8px;font-size:.86rem;font-weight:600;color:var(--muted);border-radius:8px;transition:background .15s,color .15s}
.auth-tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(17,23,37,.09)}
.auth-alert{display:none;padding:10px 13px;border-radius:var(--radius-sm);font-size:.83rem;line-height:1.5;margin-bottom:15px}
.auth-alert.show{display:block}
.auth-alert.err{background:#FEF2F2;border:1px solid #FCA5A5;color:#991B1B}
.auth-alert.ok{background:#ECFDF5;border:1px solid #6EE7B7;color:#065F46}
.auth-alt{display:block;width:100%;text-align:center;margin-top:12px;font-size:.84rem;color:var(--accent);font-weight:500}
.auth-alt:hover{text-decoration:underline}
.auth-powered{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border);font-size:.74rem;color:var(--muted)}
.auth-powered b{color:#3ECF8E;font-weight:600}
.auth-powered svg{width:14px;height:14px;flex:none}
button[disabled]{opacity:.6;cursor:not-allowed}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:fspin .6s linear infinite;vertical-align:-2px;margin-right:7px}
.btn-social .spin{border-color:rgba(91,61,245,.25);border-top-color:var(--accent)}
@keyframes fspin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* APP SHELL */
.app-shell{display:grid;grid-template-columns:240px 1fr;grid-template-rows:56px 1fr;min-height:100vh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);z-index:100;position:sticky;top:0}
.topbar-logo{display:flex;align-items:center;gap:8px;font-family:var(--font-title);font-weight:700;font-size:1.1rem;color:var(--ink)}
.topbar-logo svg{width:24px;height:24px}
.topbar-search{flex:1;max-width:360px;margin-left:24px;position:relative}
.topbar-search input{width:100%;padding:8px 12px 8px 36px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.85rem;background:var(--bg)}
.topbar-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:12px}
.btn-new-scan{padding:8px 16px;background:var(--accent);color:#fff;border-radius:var(--radius-sm);font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:6px;transition:background .15s}
.btn-new-scan:hover{background:#4A2FD4}
.btn-new-scan svg{width:14px;height:14px}
.user-menu{position:relative}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;cursor:pointer}
.user-dropdown{position:absolute;right:0;top:44px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);min-width:180px;padding:8px 0;display:none;z-index:200}
.user-dropdown.show{display:block}
.user-dropdown-item{display:block;width:100%;padding:8px 16px;text-align:left;font-size:.85rem;color:var(--ink);transition:background .1s}
.user-dropdown-item:hover{background:var(--accent-light)}
.user-dropdown-name{padding:8px 16px 4px;font-size:.82rem;font-weight:600;color:var(--ink);border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:4px}

.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);font-size:.88rem;font-weight:500;color:var(--muted);transition:background .15s,color .15s;cursor:pointer}
.sidebar-item:hover{background:var(--accent-light);color:var(--ink)}
.sidebar-item.active{background:var(--accent-light);color:var(--accent);font-weight:600}
.sidebar-item svg{width:18px;height:18px;flex-shrink:0}

.main-content{padding:28px 32px;overflow-y:auto;max-height:calc(100vh - 56px)}
@media(max-width:768px){
.app-shell{grid-template-columns:1fr}
.sidebar{position:fixed;left:-260px;top:56px;bottom:0;width:240px;z-index:99;transition:left .25s}
.sidebar.open{left:0}
.main-content{padding:20px 16px}
}

/* CARDS & COMPONENTS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.card-title{font-size:.92rem;font-weight:600;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.03em}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.kpi-card{padding:20px;display:flex;align-items:flex-start;gap:14px}
.kpi-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-icon svg{width:20px;height:20px}
.kpi-value{font-family:var(--font-title);font-size:1.6rem;font-weight:700;line-height:1.1}
.kpi-label{font-size:.8rem;color:var(--muted);margin-top:2px}
.kpi-trend{font-size:.72rem;font-weight:600;margin-top:4px}
.kpi-trend.up{color:var(--critical)}
.kpi-trend.down{color:var(--ok)}

.charts-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600;line-height:1}
.badge-critical{background:#FEE2E2;color:var(--critical)}
.badge-high{background:#FEF3C7;color:#92400E}
.badge-medium{background:#FEF9C3;color:#854D0E}
.badge-low{background:#F1F5F9;color:var(--low)}
.badge-ok{background:#D1FAE5;color:#065F46}
.badge-firestore{background:#EDE9FE;color:var(--firestore)}
.badge-rtdb{background:#E0F2FE;color:var(--rtdb)}
.badge-supabase{background:#FCE7F3;color:var(--supabase)}

.finding-card{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;transition:box-shadow .15s}
.finding-card:hover{box-shadow:var(--shadow)}
.finding-header{display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer;user-select:none}
.finding-header svg{width:16px;height:16px;color:var(--muted);transition:transform .2s}
.finding-header.open svg.chevron{transform:rotate(90deg)}
.finding-title{flex:1;font-weight:600;font-size:.92rem}
.finding-body{padding:0 20px 20px;display:none;border-top:1px solid var(--border);padding-top:16px}
.finding-body.open{display:block}
.finding-section{margin-bottom:16px}
.finding-section h4{font-size:.82rem;color:var(--muted);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.finding-section p{font-size:.88rem;color:var(--ink);line-height:1.6}
.data-table{width:100%;border-collapse:collapse;font-size:.84rem;margin-top:8px}
.data-table th{text-align:left;padding:8px 12px;background:var(--bg);font-weight:600;color:var(--muted);border:1px solid var(--border)}
.data-table td{padding:8px 12px;border:1px solid var(--border)}
.data-table .pii{color:var(--critical);font-weight:600}

.code-block{position:relative;background:#1E1E2E;color:#CDD6F4;padding:16px 20px;border-radius:var(--radius-sm);overflow-x:auto;font-size:.82rem;line-height:1.6}
.code-block .btn-copy{position:absolute;top:8px;right:8px;padding:6px 10px;background:rgba(255,255,255,.1);color:#fff;border-radius:6px;font-size:.72rem;font-weight:500;transition:background .15s}
.code-block .btn-copy:hover{background:rgba(255,255,255,.2)}

.verify-banner{display:flex;align-items:center;gap:12px;padding:16px 20px;border-radius:var(--radius-sm);margin:16px 0}
.verify-banner.clean{background:#D1FAE5;border:1px solid #6EE7B7;color:#065F46}
.verify-banner.dirty{background:#FEE2E2;border:1px solid #FCA5A5;color:#7F1D1D}
.verify-banner svg{width:20px;height:20px;flex-shrink:0}

/* WIZARD */
.wizard-steps{display:flex;align-items:center;gap:8px;margin-bottom:32px}
.wizard-step{display:flex;align-items:center;gap:8px}
.wizard-step-num{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:600;color:var(--muted)}
.wizard-step.active .wizard-step-num{border-color:var(--accent);background:var(--accent);color:#fff}
.wizard-step.done .wizard-step-num{border-color:var(--ok);background:var(--ok);color:#fff}
.wizard-step-label{font-size:.82rem;color:var(--muted);font-weight:500}
.wizard-step.active .wizard-step-label{color:var(--ink);font-weight:600}
.wizard-connector{width:32px;height:2px;background:var(--border);border-radius:1px}
.backend-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.backend-card{padding:24px;border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;text-align:center;transition:border .15s,box-shadow .15s}
.backend-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.backend-card.selected{border-color:var(--accent);background:var(--accent-light)}
.backend-card svg{width:36px;height:36px;margin-bottom:10px}
.backend-card h3{font-size:.95rem;margin-bottom:4px}
.backend-card p{font-size:.78rem;color:var(--muted)}

.textarea-wrap{position:relative}
.textarea-wrap textarea{width:100%;min-height:140px;padding:14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:.82rem;resize:vertical;line-height:1.5}
.textarea-wrap textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-light)}
.textarea-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.textarea-label label{font-size:.88rem;font-weight:600;color:var(--ink)}
.textarea-label button{font-size:.78rem;color:var(--accent);font-weight:500}

.loading-steps{display:flex;flex-direction:column;gap:12px;padding:24px 0}
.loading-step{display:flex;align-items:center;gap:12px;font-size:.88rem;color:var(--muted)}
.loading-step.active{color:var(--ink);font-weight:500}
.loading-step.done{color:var(--ok)}
.loading-step .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
.loading-step .check svg{width:18px;height:18px;color:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}

/* INTEGRATIONS */
.integration-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.integration-card{padding:24px}
.integration-card h3{font-size:1rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.integration-card p{font-size:.85rem;color:var(--muted);margin-bottom:12px;line-height:1.5}

/* SETTINGS */
.settings-section{margin-bottom:24px}
.settings-section h3{font-size:1rem;margin-bottom:12px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.toggle-row label{font-size:.88rem}
.toggle{width:40px;height:22px;background:var(--border);border-radius:11px;position:relative;cursor:pointer;transition:background .2s}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s}
.toggle.on::after{left:20px}
.danger-zone{border:1px solid var(--critical);border-radius:var(--radius);padding:20px}
.danger-zone h3{color:var(--critical)}
.btn-danger{padding:8px 16px;background:var(--critical);color:#fff;border-radius:var(--radius-sm);font-weight:600;font-size:.85rem}

/* PROJECTS TABLE */
.projects-table{width:100%;border-collapse:collapse}
.projects-table th{text-align:left;padding:12px 16px;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border-bottom:1px solid var(--border)}
.projects-table td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:.88rem}
.projects-table tr:hover td{background:var(--accent-light)}

/* EMPTY STATE */
.empty-state{text-align:center;padding:60px 24px}
.empty-state svg{width:64px;height:64px;color:var(--border);margin-bottom:16px}
.empty-state h3{font-size:1.1rem;margin-bottom:8px}
.empty-state p{color:var(--muted);font-size:.88rem;margin-bottom:20px}
.btn-secondary{padding:10px 20px;border:1px solid var(--accent);color:var(--accent);border-radius:var(--radius-sm);font-weight:600;font-size:.88rem;transition:background .15s}
.btn-secondary:hover{background:var(--accent-light)}

/* ONBOARDING */
.onboarding-card{background:linear-gradient(135deg,var(--accent-light) 0%,#fff 100%);border:1px solid var(--accent);border-radius:var(--radius);padding:24px;margin-bottom:24px}
.onboarding-card h3{color:var(--accent);margin-bottom:12px}
.onboarding-steps{display:flex;gap:16px;flex-wrap:wrap}
.onboarding-step{flex:1;min-width:160px;padding:16px;background:var(--surface);border-radius:var(--radius-sm);border:1px solid var(--border)}
.onboarding-step .step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;margin-bottom:8px}
.onboarding-step h4{font-size:.85rem;margin-bottom:4px}
.onboarding-step p{font-size:.78rem;color:var(--muted)}

/* ACTIVITY */
.activity-list{list-style:none}
.activity-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.activity-text{flex:1;font-size:.85rem}
.activity-time{font-size:.78rem;color:var(--muted)}

/* POPOVER */
.popover{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-lg);max-width:320px;z-index:300;display:none;font-size:.84rem;line-height:1.5}
.popover.show{display:block}
.popover h4{margin-bottom:8px;font-size:.88rem}

/* REPORT HEADER */
.report-header{display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.report-verdict{font-size:1.2rem;font-weight:600;line-height:1.3;margin-bottom:20px;color:var(--ink)}

/* MOBILE MENU */
.mobile-menu-btn{display:none;padding:8px;margin-right:8px}
.mobile-menu-btn svg{width:22px;height:22px}
@media(max-width:768px){.mobile-menu-btn{display:flex}}

/* TOOLTIP */
.tooltip{position:absolute;background:var(--ink);color:#fff;padding:4px 8px;border-radius:4px;font-size:.72rem;pointer-events:none;white-space:nowrap;z-index:999}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// FUGA SaaS App — Single File Application

// Traduce el error crudo de Supabase a algo que un vibe coder entienda.
function authError(err) {
  const m = ((err && (err.message || err.error_description)) || '').toLowerCase();
  if (m.includes('invalid login')) return 'Email o contraseña incorrectos. ¿Todavía no tienes cuenta? Crea una o entra en modo demo.';
  if (m.includes('email not confirmed')) return 'Tu cuenta existe pero falta confirmar el correo. Revisa tu bandeja (y spam).';
  if (m.includes('already registered') || m.includes('already been registered')) return 'Ese email ya tiene cuenta. Cambia a "Iniciar sesión".';
  if (m.includes('password') && m.includes('6')) return 'La contraseña necesita al menos 6 caracteres.';
  if (m.includes('rate limit') || m.includes('too many')) return 'Demasiados intentos seguidos. Espera un minuto e inténtalo de nuevo.';
  if (m.includes('provider is not enabled') || m.includes('unsupported provider')) return 'Ese proveedor no está habilitado en el proyecto de Supabase. Actívalo en Authentication → Providers, o entra con email.';
  if (m.includes('redirect')) return 'Falta autorizar esta URL en Supabase (Authentication → URL Configuration → Redirect URLs).';
  if (m.includes('fetch') || m.includes('network')) return 'No pudimos contactar a Supabase. Revisa tu conexión o entra en modo demo.';
  return (err && err.message) ? err.message : 'Algo falló al autenticar. Inténtalo de nuevo o entra en modo demo.';
}

function sessionFromSupabase(s) {
  const u = s.user || {};
  const meta = u.user_metadata || {};
  return {
    id: u.id,
    email: u.email || '',
    name: meta.full_name || meta.name || meta.user_name || (u.email || 'Usuario').split('@')[0],
    provider: 'supabase',
    via: (u.app_metadata && u.app_metadata.provider) || 'email',
  };
}

function getGrade(score) {
  if (score <= 9) return 'A';
  if (score <= 24) return 'B';
  if (score <= 49) return 'C';
  if (score <= 74) return 'D';
  return 'F';
}
function getGradeColor(g) {
  const m = { A: '#0FA968', B: '#0FA968', C: '#EAB308', D: '#F59E0B', F: '#E5322D' };
  return m[g] || '#64748B';
}
function getGradeLabel(g) {
  const m = { A: 'Protegido', B: 'Bien', C: 'En riesgo', D: 'Vulnerable', F: 'Crítico' };
  return m[g] || '';
}
function getSeverityColor(s) {
  const m = { critical: '#E5322D', high: '#F59E0B', medium: '#EAB308', low: '#64748B', info: '#64748B' };
  return m[s] || '#64748B';
}
function getBackendColor(b) {
  const m = { firestore: '#6D3BEB', rtdb: '#0EA5E9', supabase: '#EC4899' };
  return m[b] || '#6D3BEB';
}
function getBackendLabel(b) {
  const m = { firestore: 'Firestore', rtdb: 'Realtime DB', supabase: 'Supabase' };
  return m[b] || b;
}
function timeAgo(d) {
  const s = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
  if (s < 60) return 'Hace un momento';
  if (s < 3600) return `Hace ${Math.floor(s/60)} min`;
  if (s < 86400) return `Hace ${Math.floor(s/3600)}h`;
  return `Hace ${Math.floor(s/86400)}d`;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function renderGauge(score, size = 140) {
  const grade = getGrade(score);
  const color = getGradeColor(grade);
  const label = getGradeLabel(grade);
  const r = 54; const circ = 2 * Math.PI * r;
  const pct = Math.min(score, 100) / 100;
  const dashOff = circ * (1 - pct);
  return `<svg width="${size}" height="${size}" viewBox="0 0 128 128">
    <circle cx="64" cy="64" r="${r}" fill="none" stroke="#E4E9F2" stroke-width="10"/>
    <circle cx="64" cy="64" r="${r}" fill="none" stroke="${color}" stroke-width="10" 
      stroke-dasharray="${circ}" stroke-dashoffset="${dashOff}" 
      stroke-linecap="round" transform="rotate(-90 64 64)" style="transition:stroke-dashoffset .6s"/>
    <text x="64" y="56" text-anchor="middle" font-family="Space Grotesk" font-size="26" font-weight="700" fill="${color}">${grade}</text>
    <text x="64" y="74" text-anchor="middle" font-family="Inter" font-size="10" fill="#5B6675">${score}/100</text>
    <text x="64" y="92" text-anchor="middle" font-family="Inter" font-size="9" font-weight="600" fill="${color}">${label}</text>
  </svg>`;
}

function renderDonut(data, size = 160) {
  // data: [{label, value, color}]
  const total = data.reduce((a, d) => a + d.value, 0);
  if (!total) return `<svg width="${size}" height="${size}" viewBox="0 0 128 128"><circle cx="64" cy="64" r="50" fill="none" stroke="#E4E9F2" stroke-width="14"/><text x="64" y="68" text-anchor="middle" font-family="Inter" font-size="10" fill="#5B6675">Sin datos</text></svg>`;
  const r = 50; const circ = 2 * Math.PI * r;
  let offset = 0;
  const paths = data.map(d => {
    const pct = d.value / total;
    const dash = circ * pct;
    const o = offset; offset += dash;
    return `<circle cx="64" cy="64" r="${r}" fill="none" stroke="${d.color}" stroke-width="14" stroke-dasharray="${dash} ${circ - dash}" stroke-dashoffset="${-o}" transform="rotate(-90 64 64)"/>`;
  }).join('');
  const legend = data.filter(d => d.value > 0).map(d => `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:.75rem"><span style="width:8px;height:8px;border-radius:50%;background:${d.color};display:inline-block"></span>${d.label}: ${d.value}</span>`).join('');
  return `<div style="text-align:center"><svg width="${size}" height="${size}" viewBox="0 0 128 128">${paths}<text x="64" y="68" text-anchor="middle" font-family="Space Grotesk" font-size="20" font-weight="700" fill="#111725">${total}</text></svg><div style="margin-top:8px">${legend}</div></div>`;
}

function renderLineChart(points, w = 300, h = 120) {
  if (!points.length) return `<div style="text-align:center;padding:24px;color:var(--muted);font-size:.85rem">Ejecuta más escaneos para ver la tendencia</div>`;
  const max = Math.max(...points, 10);
  const step = w / Math.max(points.length - 1, 1);
  const coords = points.map((p, i) => `${(i * step).toFixed(1)},${(h - (p / max) * (h - 20) - 10).toFixed(1)}`);
  const polyline = coords.join(' ');
  const area = `0,${h} ${polyline} ${((points.length - 1) * step).toFixed(1)},${h}`;
  const grid = [0, 25, 50, 75, 100].filter(v => v <= max).map(v => {
    const y = (h - (v / max) * (h - 20) - 10).toFixed(1);
    return `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="#E4E9F2" stroke-width="0.5"/><text x="-4" y="${y}" text-anchor="end" font-size="8" fill="#5B6675">${v}</text>`;
  }).join('');
  return `<svg width="100%" viewBox="-30 0 ${w + 40} ${h + 10}" preserveAspectRatio="xMidYMid meet">
    ${grid}
    <polygon points="${area}" fill="url(#areaGrad)" opacity="0.3"/>
    <polyline points="${polyline}" fill="none" stroke="#5B3DF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${coords.map((c, i) => `<circle cx="${c.split(',')[0]}" cy="${c.split(',')[1]}" r="3" fill="#5B3DF5"/>`).join('')}
    <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5B3DF5"/><stop offset="100%" stop-color="#5B3DF5" stop-opacity="0"/></linearGradient></defs>
  </svg>`;
}

function renderBars(data, w = 280, h = 120) {
  // data: [{label, value, color}]
  if (!data.length || data.every(d => !d.value)) return `<div style="text-align:center;padding:24px;color:var(--muted);font-size:.85rem">Sin datos de backends</div>`;
  const max = Math.max(...data.map(d => d.value), 1);
  const barW = Math.min(50, (w - 20) / data.length - 10);
  const bars = data.map((d, i) => {
    const bh = (d.value / max) * (h - 30);
    const x = 10 + i * ((w - 20) / data.length) + ((w - 20) / data.length - barW) / 2;
    return `<rect x="${x}" y="${h - 20 - bh}" width="${barW}" height="${bh}" rx="4" fill="${d.color}"/>
      <text x="${x + barW / 2}" y="${h - 6}" text-anchor="middle" font-size="8" fill="#5B6675">${d.label}</text>
      <text x="${x + barW / 2}" y="${h - 24 - bh}" text-anchor="middle" font-size="9" font-weight="600" fill="${d.color}">${d.value}</text>`;
  }).join('');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
}

}

function bindLogin() {
  let tab = 'signin';
  const msgEl = document.getElementById('auth-msg');
  const submit = document.getElementById('auth-submit');
  const emailEl = document.getElementById('login-email');
  const passEl = document.getElementById('login-pass');
  const titleEl = document.getElementById('auth-title');

  const say = (text, type) => { if (msgEl) { msgEl.className = 'auth-alert show ' + (type || 'err'); msgEl.textContent = text; } };
  const clear = () => { if (msgEl) { msgEl.className = 'auth-alert'; msgEl.textContent = ''; } };
  const lock = (btn, on, label) => {
    if (!btn) return;
    if (on) { btn.dataset.orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>' + label; }
    else { btn.disabled = false; if (btn.dataset.orig) btn.innerHTML = btn.dataset.orig; }
  };
  const enterDemo = () => {
    state.session = { email: 'demo@fuga.dev', name: 'Usuario Demo', provider: 'demo' };
    saveSession(); render();
  };

  // OAuth devuelve los errores en el fragmento de la URL.
  if (window.location.hash && window.location.hash.indexOf('error') !== -1) {
    const p = new URLSearchParams(window.location.hash.slice(1));
    const d = p.get('error_description') || p.get('error');
    if (d) say(authError({ message: decodeURIComponent(d.replace(/\+/g, ' ')) }));
    history.replaceState(null, '', window.location.pathname);
  }

  document.querySelectorAll('.auth-tab').forEach(t => t.onclick = () => {
    tab = t.dataset.tab;
    document.querySelectorAll('.auth-tab').forEach(x => {
      const on = x === t;
      x.classList.toggle('active', on);
      x.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    submit.textContent = tab === 'signup' ? 'Crear cuenta' : 'Iniciar sesión';
    titleEl.textContent = tab === 'signup' ? 'Crea tu cuenta de FUGA' : 'Entra a tu consola de seguridad';
    passEl.autocomplete = tab === 'signup' ? 'new-password' : 'current-password';
    clear();
  });

  const form = document.getElementById('login-form');
  if (form) form.onsubmit = async e => {
    e.preventDefault(); clear();
    const email = (emailEl.value || '').trim();
    const pass = passEl.value || '';
    if (!email || !pass) return say('Escribe tu email y tu contraseña.');
    if (!sb) { say('Supabase no responde ahora mismo. Te llevamos al modo demo…', 'ok'); return setTimeout(enterDemo, 900); }
    lock(submit, true, tab === 'signup' ? 'Creando cuenta…' : 'Entrando…');
    try {
      if (tab === 'signup') {
        const { data, error } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: window.location.origin + '/app.html' } });
        if (error) throw error;
        if (!(data && data.session)) say('Cuenta creada. Te mandamos un correo de confirmación: ábrelo y vuelve aquí.', 'ok');
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) throw error;
      }
      // Si hay sesión, onAuthStateChange entra a la consola.
    } catch (err) { say(authError(err)); }
    lock(submit, false);
  };

  const magic = document.getElementById('btn-magic');
  if (magic) magic.onclick = async e => {
    e.preventDefault(); clear();
    const email = (emailEl.value || '').trim();
    if (!email) { emailEl.focus(); return say('Escribe tu email arriba y te mandamos el enlace.'); }
    if (!sb) return say('Supabase no responde ahora mismo. Entra en modo demo.');
    say('Enviando el enlace…', 'ok');
    try {
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.origin + '/app.html' } });
      if (error) throw error;
      say('Listo. Revisa tu correo (mira también spam) y abre el enlace para entrar.', 'ok');
    } catch (err) { say(authError(err)); }
  };

  const oauth = (btn, provider) => {
    if (!btn) return;
    btn.onclick = async () => {
      clear();
      if (!sb) return say('Supabase no responde ahora mismo. Entra en modo demo.');
      lock(btn, true, 'Redirigiendo…');
      try {
        const { error } = await sb.auth.signInWithOAuth({ provider, options: { redirectTo: window.location.origin + '/app.html' } });
        if (error) throw error;
      } catch (err) { say(authError(err)); lock(btn, false); }
    };
  };
  oauth(document.getElementById('btn-github'), 'github');
  oauth(document.getElementById('btn-google'), 'google');

  // Preguntamos al proyecto qué proveedores están realmente activos para no
  // dejar botones muertos: si GitHub/Google están apagados, se deshabilitan.
  if (sb) {
    fetch(SUPABASE_URL + '/auth/v1/settings', { headers: { apikey: SUPABASE_ANON_KEY } })
      .then(r => r.json())
      .then(cfg => {
        const ext = (cfg && cfg.external) || {};
        [['btn-github', 'github', 'GitHub'], ['btn-google', 'google', 'Google']].forEach(p => {
          if (ext[p[1]]) return;
          const b = document.getElementById(p[0]);
          if (!b) return;
          b.disabled = true;
          b.title = p[2] + ' no está habilitado en este proyecto de Supabase (Authentication → Providers).';
          b.insertAdjacentHTML('beforeend', '<span style="font-size:.72rem;color:var(--muted);font-weight:400">no habilitado</span>');
        });
      })
      .catch(() => { /* si no podemos preguntar, dejamos los botones y el error explica */ });
  }

  const demo = document.getElementById('btn-demo');
  if (demo) demo.onclick = e => { e.preventDefault(); enterDemo(); };
}

// ═══ DASHBOARD ═══
function renderDashboard() {
  const projects = state.projects;
  const allScans = projects.flatMap(p => (p.scans || []).map(s => ({ ...s, project: p.name, backend: p.backend })));
  const latestScans = allScans.sort((a, b) => new Date(b.at) - new Date(a.at));
  const totalLeaks = latestScans.reduce((a, s) => a + (s.exploit?.leaks?.length || 0), 0);
  const totalExposed = latestScans.reduce((a, s) => a + (s.exploit?.totalDocsExposed || 0), 0);
  const fixedCount = latestScans.filter(s => s.verify?.clean).length;
  
  // Average risk for gauge
  const lastRisks = projects.map(p => p.scans?.length ? p.scans[p.scans.length - 1].risk : null).filter(r => r !== null);
  const avgRisk = lastRisks.length ? Math.round(lastRisks.reduce((a, b) => a + b, 0) / lastRisks.length) : 0;
  
  // Severity donut
  const sevCounts = { critical: 0, high: 0, medium: 0, low: 0 };
  latestScans.forEach(s => { if (s.scan?.summary) { sevCounts.critical += s.scan.summary.critical || 0; sevCounts.high += s.scan.summary.high || 0; sevCounts.medium += s.scan.summary.medium || 0; sevCounts.low += s.scan.summary.low || 0; } });
  const donutData = [
    { label: 'Crítico', value: sevCounts.critical, color: '#E5322D' },
    { label: 'Alto', value: sevCounts.high, color: '#F59E0B' },
    { label: 'Medio', value: sevCounts.medium, color: '#EAB308' },
    { label: 'Bajo', value: sevCounts.low, color: '#64748B' },
  ];
  
  // Line chart: risk over time
  const riskHistory = latestScans.slice(0, 10).reverse().map(s => s.risk || 0);
  
  // Bars: by backend
  const backendCounts = { firestore: 0, rtdb: 0, supabase: 0 };
  latestScans.forEach(s => { if (s.backend && backendCounts[s.backend] !== undefined) backendCounts[s.backend]++; });
  const barsData = [
    { label: 'Firestore', value: backendCounts.firestore, color: '#6D3BEB' },
    { label: 'Realtime DB', value: backendCounts.rtdb, color: '#0EA5E9' },
    { label: 'Supabase', value: backendCounts.supabase, color: '#EC4899' },
  ];

  const hasData = projects.length > 0;
  
  if (!hasData) {
    return `<div>
      <h2 style="margin-bottom:24px">Dashboard</h2>
      <div class="onboarding-card">
        <h3>¿Primera vez? 3 pasos para asegurar tu app</h3>
        <div class="onboarding-steps">
          <div class="onboarding-step"><div class="step-num">1</div><h4>Conecta tu proyecto</h4><p>Elige el backend que usas</p></div>
          <div class="onboarding-step"><div class="step-num">2</div><h4>Ejecuta un escaneo</h4><p>Pega tus reglas de seguridad</p></div>
          <div class="onboarding-step"><div class="step-num">3</div><h4>Aplica el fix</h4><p>Copia las reglas reparadas</p></div>
        </div>
        <button class="btn-primary" style="margin-top:16px;width:auto;padding:10px 24px" data-nav="new-scan">Crear tu primer escaneo</button>
      </div>
      <div class="empty-state">
        ${ICONS.shield}
        <h3>Aún no hay datos</h3>
        <p>Ejecuta tu primer escaneo para ver métricas de seguridad aquí.</p>
        <button class="btn-secondary" data-nav="new-scan">Nuevo escaneo</button>
      </div>
    </div>`;
  }

  // Verdict
  let verdict = 'Todo protegido. ¡Buen trabajo!';
  if (avgRisk > 74) verdict = 'Tu base de datos está expuesta ahora mismo. Necesitas actuar ya.';
  else if (avgRisk > 49) verdict = 'Tienes vulnerabilidades serias que podrían exponer datos.';
  else if (avgRisk > 24) verdict = 'Hay algunos riesgos que deberías revisar pronto.';
  else if (avgRisk > 9) verdict = 'Tu seguridad es decente, pero hay margen de mejora.';

  return `<div>
    <h2 style="margin-bottom:24px">Dashboard</h2>
    <div style="display:grid;grid-template-columns:auto 1fr;gap:24px;margin-bottom:24px;align-items:start">
      <div class="card" style="text-align:center;padding:28px 32px">
        <div class="card-title">Security Score</div>
        ${renderGauge(avgRisk)}
        <p style="font-size:.85rem;color:var(--muted);margin-top:8px;max-width:180px">${verdict}</p>
      </div>
      <div class="kpi-row">
        <div class="card kpi-card">
          <div class="kpi-icon" style="background:var(--accent-light)">${ICONS.projects}</div>
          <div><div class="kpi-value">${projects.length}</div><div class="kpi-label">Proyectos monitoreados</div></div>
        </div>
        <div class="card kpi-card">
          <div class="kpi-icon" style="background:#FEE2E2">${ICONS.leak}</div>
          <div><div class="kpi-value" style="color:var(--critical)">${totalLeaks}</div><div class="kpi-label">Fugas activas</div>${totalLeaks > 0 ? '<div class="kpi-trend up">Requiere atención</div>' : ''}</div>
        </div>
        <div class="card kpi-card">
          <div class="kpi-icon" style="background:#FEF3C7">${ICONS.docs}</div>
          <div><div class="kpi-value">${totalExposed}</div><div class="kpi-label">Registros expuestos</div></div>
        </div>
        <div class="card kpi-card">
          <div class="kpi-icon" style="background:#D1FAE5">${ICONS.fix}</div>
          <div><div class="kpi-value" style="color:var(--ok)">${fixedCount}</div><div class="kpi-label">Fugas corregidas</div>${fixedCount > 0 ? '<div class="kpi-trend down">Verificadas</div>' : ''}</div>
        </div>
      </div>
    </div>
    <div class="charts-row">
      <div class="card"><div class="card-title">Severidad de hallazgos</div>${renderDonut(donutData)}</div>
      <div class="card"><div class="card-title">Riesgo en el tiempo</div>${renderLineChart(riskHistory)}</div>
      <div class="card"><div class="card-title">Escaneos por backend</div>${renderBars(barsData)}</div>
    </div>
    ${latestScans.length ? `<div class="card"><div class="card-title">Actividad reciente</div><ul class="activity-list">${latestScans.slice(0, 5).map(s => `<li class="activity-item"><span class="activity-dot" style="background:${getBackendColor(s.backend)}"></span><span class="activity-text"><strong>${s.project}</strong> — ${getBackendLabel(s.backend)} — Grado ${getGrade(s.risk)}</span><span class="activity-time">${timeAgo(s.at)}</span></li>`).join('')}</ul></div>` : ''}
  </div>`;
}

function bindNewScan() {
  // Step 1
  document.querySelectorAll('[data-backend]').forEach(el => {
    el.onclick = () => { state.wizard.backend = el.dataset.backend; render(); };
  });
  const next1 = document.getElementById('wizard-next-1');
  if (next1) next1.onclick = () => { if (state.wizard.backend) { state.wizard.step = 2; render(); } };
  // Step 2
  const back2 = document.getElementById('wizard-back-2');
  if (back2) back2.onclick = () => { state.wizard.step = 1; render(); };
  const next2 = document.getElementById('wizard-next-2');
  if (next2) next2.onclick = () => {
    state.wizard.name = document.getElementById('scan-name').value || 'Proyecto sin nombre';
    state.wizard.rules = document.getElementById('scan-rules').value;
    state.wizard.code = document.getElementById('scan-code').value;
    if (!state.wizard.rules.trim()) { alert('Pega tus reglas de seguridad para continuar.'); return; }
    state.wizard.step = 3; render();
  };
  const btnExample = document.getElementById('btn-example');
  if (btnExample) btnExample.onclick = () => {
    const ta = document.getElementById('scan-rules');
    if (ta) { ta.value = EXAMPLES[state.wizard.backend] || EXAMPLES.firestore; state.wizard.rules = ta.value; }
  };
  const btnHelp = document.getElementById('btn-help-rules');
  const helpPop = document.getElementById('help-popover');
  if (btnHelp && helpPop) btnHelp.onclick = () => helpPop.classList.toggle('show');
  const closeHelp = document.getElementById('close-help');
  if (closeHelp) closeHelp.onclick = () => helpPop.classList.remove('show');
  // Step 3
  const back3 = document.getElementById('wizard-back-3');
  if (back3) back3.onclick = () => { state.wizard.step = 2; render(); };
  const btnScan = document.getElementById('btn-scan-now');
  if (btnScan) btnScan.onclick = () => startScan();
}

async function startScan() {
  state.loading = true;
  render();
  // Animate loading steps
  const steps = document.querySelectorAll('#loading-steps .loading-step');
  for (let i = 0; i < steps.length; i++) {
    await new Promise(r => setTimeout(r, 600 + Math.random() * 400));
    if (steps[i - 1]) { steps[i - 1].classList.remove('active'); steps[i - 1].classList.add('done'); steps[i - 1].querySelector('.spinner').style.display = 'none'; steps[i - 1].innerHTML = `<span style="color:var(--ok)">${ICONS.check}</span><span>${steps[i - 1].querySelector('span:last-child').textContent}</span>`; }
    steps[i].classList.add('active');
    steps[i].querySelector('.spinner').style.opacity = '1';
  }
  // Call API
  try {
    const resp = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rules: state.wizard.rules, code: state.wizard.code || undefined, backend: state.wizard.backend })
    });
    if (!resp.ok) throw new Error('API error ' + resp.status);
    const data = await resp.json();
    // Save project
    const project = state.projects.find(p => p.name === state.wizard.name && p.backend === (data.backend || state.wizard.backend));
    const scanEntry = { at: new Date().toISOString(), risk: data.scan?.riskScore || 0, grade: getGrade(data.scan?.riskScore || 0), backend: data.backend || state.wizard.backend, scan: data.scan, exploit: data.exploit, fix: data.fix, verify: data.verify, crossTenant: data.crossTenant || [] };
    if (project) {
      project.scans.push(scanEntry);
    } else {
      state.projects.push({ id: uid(), name: state.wizard.name, backend: data.backend || state.wizard.backend, rules: state.wizard.rules, code: state.wizard.code, createdAt: new Date().toISOString(), scans: [scanEntry] });
    }
    saveProjects();
    state.activeReport = { project: state.wizard.name, scan: scanEntry, backend: data.backend || state.wizard.backend };
    state.wizard = { step: 1, backend: null, name: '', rules: '', code: '' };
    state.loading = false;
    navigate('report');
  } catch (err) {
    // Mark last step done and show error
    if (steps[steps.length - 1]) { steps[steps.length - 1].classList.remove('active'); steps[steps.length - 1].classList.add('done'); }
    state.loading = false;
    alert('Error al conectar con la API: ' + err.message + '\nAsegúrate de que el servidor esté corriendo.');
    render();
  }
}

// ═══ HELPERS AÑADIDOS ═══
function escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sevLabel(s){return {critical:'Crítico',high:'Alto',medium:'Medio',low:'Bajo',info:'Info'}[s]||s;}
function backendClass(b){return b==='rtdb'?'badge-rtdb':b==='supabase'?'badge-supabase':'badge-firestore';}
function backendLabel(b){return b==='rtdb'?'Realtime DB':b==='supabase'?'Supabase':'Firestore';}

// ═══ DISPATCHER + BOOT (faltaban) ═══
function render(){
  const app=document.getElementById('app');
  if(!app)return;
  if(!state.session){ app.innerHTML=renderLogin(); bindLogin(); return; }
  state.view=state.view||'dashboard';
  let content='';
  switch(state.view){
    case 'projects': content=renderProjects(); break;
    case 'new-scan': content=renderNewScan(); break;
    case 'report': content=renderReport(); break;
    case 'integrations': content=renderIntegrations(); break;
    case 'settings': content=renderSettings(); break;
    default: content=renderDashboard();
  }
  app.innerHTML=renderShell(content);
  bindShell();
  if(state.view==='new-scan') bindNewScan();
  else if(state.view==='report') bindReport();
  else if(state.view==='projects') bindProjects();
  else if(state.view==='integrations') bindIntegrations();
  else if(state.view==='settings') bindSettings();
}

// ═══ REPORTE (visualizado, no JSON) ═══
function renderReport(){
  const ar=state.activeReport;
  if(!ar||!ar.scan) return '<div class="empty-state">'+ICONS.shield+'<p>No hay ningún reporte todavía.</p><button class="btn-primary" data-nav="new-scan">Crear un escaneo</button></div>';
  const e=ar.scan, sc=e.scan||{}, ex=e.exploit||{}, fx=e.fix||{}, vf=e.verify||{};
  const risk=sc.riskScore||0, grade=getGrade(risk), sev=sc.summary||{};
  const verdict = risk>=75 ? 'Cualquiera en internet puede acceder a los datos de tus usuarios ahora mismo.'
    : risk>=25 ? 'Hay reglas que exponen datos a usuarios no autorizados.'
    : 'Tus reglas se ven razonablemente seguras.';
  const chips=['critical','high','medium','low'].filter(k=>sev[k]).map(k=>'<span class="badge badge-'+k+'">'+sev[k]+' '+sevLabel(k).toLowerCase()+'s</span>').join(' ');
  const findings=(sc.findings||[]).map(f=>`<div class="finding-card"><div class="finding-header"><span class="badge badge-${f.severity}">${sevLabel(f.severity)}</span><span class="finding-title">${escapeHtml(f.title)}</span><span style="margin-left:auto;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.78rem">${escapeHtml(f.matchPath||'')}</span></div><div class="finding-body"><div class="finding-section"><strong>Qué significa</strong><p>${escapeHtml(f.rationale||'')}</p></div><div class="finding-section"><strong>Cómo arreglarlo</strong><p>${escapeHtml(f.recommendation||'')}</p></div>${f.piiFields&&f.piiFields.length?'<div class="finding-section"><strong>Datos sensibles en riesgo:</strong> '+f.piiFields.map(p=>'<span class="badge badge-critical" style="font-size:.62rem">'+escapeHtml(p)+'</span>').join(' ')+'</div>':''}</div></div>`).join('');
  const readLeaks=(ex.leaks||[]).filter(l=>l.method==='read'&&l.exfiltrated&&l.exfiltrated.length);
  const evidence = readLeaks.length ? readLeaks.map(l=>{
    const rec=l.exfiltrated[0]||{};
    const rows=Object.entries(rec).map(([k,v])=>{const pii=(l.piiFields||[]).includes(k);return '<tr><td>'+escapeHtml(k)+'</td><td style="font-family:\'JetBrains Mono\',monospace;'+(pii?'color:var(--danger);font-weight:600':'')+'">'+escapeHtml(String(v))+(pii?' <span class="badge badge-critical" style="font-size:.58rem">PII</span>':'')+'</td></tr>';}).join('');
    return '<div class="card"><div class="card-title">'+ICONS.leak+' Lectura anónima de <code>'+escapeHtml(l.path)+'</code></div><table class="data-table"><tbody>'+rows+'</tbody></table></div>';
  }).join('') : '<p style="color:var(--muted)">No se exfiltraron documentos en este escaneo.</p>';
  return `<div class="report-view">
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">
      <div><h2 style="margin:0 0 6px">${escapeHtml(ar.project||'Escaneo')}</h2><span class="badge ${backendClass(ar.backend)}">${backendLabel(ar.backend)}</span> <span style="color:var(--muted)">${timeAgo(e.at)}</span></div>
      <div style="text-align:center">${renderGauge(risk,120)}<div style="font-weight:700;margin-top:4px">Grado ${grade}</div></div>
    </div>
    <div class="card" style="border-left:4px solid ${risk>=75?'var(--danger)':risk>=25?'var(--medium,#EAB308)':'var(--ok)'}"><h3 style="margin:0 0 6px">Veredicto</h3><p style="font-size:1.05rem;margin:0">${verdict}</p><div style="margin-top:12px">${chips}</div></div>
    ${renderCrossTenant(e.crossTenant)}
    <h3 style="margin:24px 0 8px">Hallazgos</h3>${findings||'<p style="color:var(--muted)">Sin hallazgos.</p>'}
    <h3 style="margin:24px 0 8px">Datos que un atacante puede robar</h3><p style="color:var(--muted);margin:0 0 12px">${ex.leaks?ex.leaks.filter(l=>l.proven).length:0} fugas · ${ex.totalDocsExposed||0} documentos exfiltrables</p>${evidence}
    <h3 style="margin:24px 0 8px">Tu fix</h3>
    <div class="card"><div class="card-title">${ICONS.fix} Reglas endurecidas${fx.source?' ('+escapeHtml(fx.source)+')':''}</div><pre class="code-block" id="fix-code">${escapeHtml(fx.rules||'')}</pre><button class="btn-copy" id="copy-fix">${ICONS.copy} Copiar todo</button></div>
    ${vf.clean?'<div class="card" style="border-color:var(--ok);background:#F0FBF6"><strong style="color:var(--ok)">'+ICONS.check+' Verificado: con este fix, el atacante anónimo Y cualquier otro usuario ajeno quedan bloqueados. Re-lanzamos el ataque para confirmarlo.</strong></div>':'<div class="card" style="border-color:var(--danger)"><strong style="color:var(--danger)">'+ICONS.alert+' Aún quedan '+(vf.remaining||0)+' fugas.</strong></div>'}
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn-secondary" id="dl-report">${ICONS.download} Descargar reporte</button><button class="btn-secondary" id="toggle-json">Ver datos técnicos</button></div>
    <pre class="code-block" id="raw-json" style="display:none;margin-top:12px">${escapeHtml(JSON.stringify(e,null,2))}</pre>
  </div>`;
}
// El diferenciador: fuga ENTRE USUARIOS (un usuario lee/edita datos de otro).
function renderCrossTenant(leaks){
  if(!leaks||!leaks.length) return '';
  const items=leaks.map(l=>{
    const rec=l.victimData||{};
    const pii=(l.piiFields||[]);
    const rows=Object.entries(rec).filter(([k])=>k!=='uid'&&k!=='ownerId'&&k!=='userId').map(([k,v])=>{const p=pii.includes(k);return '<tr><td>'+escapeHtml(k)+'</td><td style="font-family:\'JetBrains Mono\',monospace;'+(p?'color:var(--danger);font-weight:600':'')+'">'+escapeHtml(String(v))+(p?' <span class="badge badge-critical" style="font-size:.58rem">PII</span>':'')+'</td></tr>';}).join('');
    const verbo=l.method==='read'?'leyó':'modificó';
    return '<div style="margin-top:14px"><div style="font-weight:600;margin-bottom:6px">'+ICONS.leak+' En <code>'+escapeHtml(l.collection)+'</code>: <span style="color:var(--danger)">Mallory '+verbo+' el registro de Alice</span></div>'
      +'<div style="font-size:.82rem;color:var(--muted);margin-bottom:6px">Regla que lo permite: <code>'+escapeHtml(l.rule||'')+'</code></div>'
      +'<table class="data-table"><tbody>'+rows+'</tbody></table></div>';
  }).join('');
  return '<div class="card" style="border:2px solid var(--danger);background:#FEF6F6">'
    +'<div class="card-title" style="color:var(--danger)">'+ICONS.alert+' Fuga entre usuarios — el bug que otros escáneres no ven</div>'
    +'<p style="margin:0 0 4px">Tu regla exige estar autenticado, pero <strong>no comprueba que seas el dueño del dato</strong>. Cualquier usuario con una cuenta puede alcanzar los registros de los demás. No lo suponemos: lo probamos usando dos cuentas.</p>'
    +items+'</div>';
}
function bindReport(){
  const c=document.getElementById('copy-fix'); if(c) c.onclick=()=>{const el=document.getElementById('fix-code'); if(el){copyText(el.textContent); c.innerHTML=ICONS.check+' Copiado'; setTimeout(()=>c.innerHTML=ICONS.copy+' Copiar todo',1500);} };
  const t=document.getElementById('toggle-json'); if(t) t.onclick=()=>{const el=document.getElementById('raw-json'); if(el) el.style.display=el.style.display==='none'?'block':'none';};
  const d=document.getElementById('dl-report'); if(d) d.onclick=downloadReport;
}
function downloadReport(){
  const ar=state.activeReport; if(!ar)return; const e=ar.scan;
  const md='# Reporte de seguridad FUGA — '+(ar.project||'')+'\n\n- Backend: '+backendLabel(ar.backend)+'\n- Riesgo: '+(e.scan?.riskScore||0)+'/100 (Grado '+getGrade(e.scan?.riskScore||0)+')\n- Fugas: '+(e.exploit?.leaks?(e.exploit.leaks.filter(l=>l.proven).length):0)+' · Documentos exfiltrables: '+(e.exploit?.totalDocsExposed||0)+'\n- Verificado: '+(e.verify?.clean?'sí':'no')+'\n\n## Hallazgos\n'+(e.scan?.findings||[]).map(f=>'- ['+f.severity+'] '+f.code+' — '+f.title+' ('+f.matchPath+')').join('\n')+'\n\n## Fix\n```\n'+(e.fix?.rules||'')+'\n```\n';
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'})); a.download='fuga-'+(ar.project||'reporte')+'.md'; a.click();
}

// ═══ PROYECTOS ═══
function renderProjects(){
  const ps=state.projects||[];
  if(!ps.length) return '<div class="empty-state">'+ICONS.projects+'<p>Aún no tienes proyectos.</p><button class="btn-primary" data-nav="new-scan">Nuevo escaneo</button></div>';
  const rows=ps.map(p=>{const last=p.scans&&p.scans[p.scans.length-1]; const risk=last?last.risk:0, g=getGrade(risk);
    return `<tr><td><strong>${escapeHtml(p.name)}</strong></td><td><span class="badge ${backendClass(p.backend)}">${backendLabel(p.backend)}</span></td><td><span style="color:${getGradeColor(g)};font-weight:700">${g} · ${risk}</span></td><td>${last&&last.exploit?(last.exploit.leaks?last.exploit.leaks.filter(l=>l.proven).length:0):0}</td><td style="color:var(--muted)">${last?timeAgo(last.at):'—'}</td><td style="text-align:right"><button class="btn-secondary" data-report="${escapeHtml(p.name)}">Ver reporte</button> <button class="btn-danger" data-del="${escapeHtml(p.id)}" title="Eliminar">${ICONS.trash}</button></td></tr>`;
  }).join('');
  return `<div class="card"><div class="card-title">Proyectos monitoreados</div><table class="projects-table"><thead><tr><th>Proyecto</th><th>Backend</th><th>Grado</th><th>Fugas</th><th>Último escaneo</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function bindProjects(){
  document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>{const p=state.projects.find(x=>x.name===b.dataset.report); if(p&&p.scans&&p.scans.length){state.activeReport={project:p.name,scan:p.scans[p.scans.length-1],backend:p.backend}; navigate('report');}});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.projects=state.projects.filter(x=>x.id!==b.dataset.del); saveProjects(); render();});
}

// ═══ INTEGRACIONES ═══
function renderIntegrations(){
  const mcp='{\n  "mcpServers": {\n    "fuga": { "command": "npx", "args": ["-y", "@fuga/mcp"] }\n  }\n}';
  const card=(name,desc,id)=>`<div class="integration-card"><div class="card-title">${name}</div><p style="color:var(--muted);margin:.3rem 0 .6rem">${desc}</p><pre class="code-block" id="${id}">${escapeHtml(mcp)}</pre><button class="btn-copy" data-copy="${id}">${ICONS.copy} Copiar</button></div>`;
  return `<div class="card"><div class="card-title">${ICONS.integrations} Conecta FUGA a tu editor de IA</div><p style="color:var(--muted)">Añade FUGA como servidor MCP y tu agente revisa la seguridad de tus reglas mientras programas.</p><div class="integration-cards">${card('Cursor','Config MCP de Cursor.','mcp-cursor')}${card('Kiro','En .kiro/settings/mcp.json.','mcp-kiro')}${card('Claude Desktop','En claude_desktop_config.json.','mcp-claude')}</div></div>
  <div class="card"><div class="card-title">${ICONS.docs} Línea de comandos</div><p style="color:var(--muted)">Escanea y arregla desde tu terminal, sin instalar nada.</p><pre class="code-block" id="cli">npx fuga scan\nnpx fuga fix</pre><button class="btn-copy" data-copy="cli">${ICONS.copy} Copiar</button></div>
  <div class="card"><div class="card-title">${ICONS.check} Escaneo automático al guardar</div><p style="color:var(--muted)">Con el hook de Kiro, FUGA revisa tus reglas cada vez que guardas un archivo <code>.rules</code>. Cero esfuerzo.</p></div>`;
}
function bindIntegrations(){ document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const el=document.getElementById(b.dataset.copy); if(el){copyText(el.textContent); b.innerHTML=ICONS.check+' Copiado'; setTimeout(()=>b.innerHTML=ICONS.copy+' Copiar',1500);} }); }

// ═══ CONFIGURACIÓN ═══
function renderSettings(){
  const s=state.session||{};
  const cloud=s.provider==='supabase';
  const via={github:'GitHub',google:'Google',email:'email y contraseña'}[s.via]||'email';
  return `<div class="settings-section card"><div class="card-title">Perfil</div><p style="margin:0"><strong>${escapeHtml(s.name||'Usuario')}</strong><br><span style="color:var(--muted)">${escapeHtml(s.email||'')}</span></p></div>
  <div class="settings-section card"><div class="card-title">Sesión</div>${cloud
    ? `<p style="margin:0 0 10px"><span class="badge badge-supabase">Supabase Auth</span> Sesión real, iniciada con ${via}. Tu token se refresca solo y viaja cifrado.</p><p style="color:var(--muted);margin:0;font-size:.85rem">ID de usuario: <code style="font-family:'JetBrains Mono',monospace">${escapeHtml(s.id||'—')}</code></p>`
    : `<p style="margin:0 0 10px"><span class="badge badge-medium">Modo demo</span> Estás explorando sin cuenta. Tus escaneos viven solo en este navegador.</p><button class="btn-primary" id="to-login" style="width:auto;padding:9px 18px">Crear una cuenta real</button>`}</div>
  <div class="settings-section card"><div class="card-title">Plan</div><p>Estás en el plan <strong>Free</strong>. Pro añade monitoreo continuo, alertas por email y escaneo en CI.</p><button class="btn-primary">Mejorar a Pro</button></div>
  <div class="settings-section card"><div class="card-title">Notificaciones</div><label style="display:block;margin:.4rem 0"><input type="checkbox" checked> Alertas por email cuando aparece una fuga</label><label style="display:block;margin:.4rem 0"><input type="checkbox"> Resumen semanal de seguridad</label></div>
  <div class="settings-section card"><div class="card-title">API key</div><pre class="code-block" id="apikey">fuga_sk_live_51H8xSECRETxxxxxxxx</pre><button class="btn-copy" data-copy2="apikey">${ICONS.copy} Copiar</button></div>
  <div class="settings-section card" style="border-color:var(--danger)"><div class="card-title" style="color:var(--danger)">Zona de peligro</div><p style="color:var(--muted)">Borra todos tus proyectos y escaneos de este navegador.</p><button class="btn-danger" id="wipe">${ICONS.trash} Borrar todos mis datos</button></div>`;
}
function bindSettings(){
  const w=document.getElementById('wipe'); if(w) w.onclick=()=>{ if(confirm('¿Borrar todos tus proyectos?')){ localStorage.removeItem('fuga_projects'); state.projects=[]; render(); } };
  const tl=document.getElementById('to-login'); if(tl) tl.onclick=()=>{ state.session=null; localStorage.removeItem('fuga_session'); render(); };
  document.querySelectorAll('[data-copy2]').forEach(b=>b.onclick=()=>{const el=document.getElementById(b.dataset.copy2); if(el) copyText(el.textContent);});
}

// ═══ ARRANQUE ═══
async function boot() {
  if (sb) {
    try {
      const { data } = await sb.auth.getSession();
      if (data && data.session) {
        state.session = sessionFromSupabase(data.session);
        saveSession();
      } else if (state.session && state.session.provider === 'supabase') {
        // La sesión de Supabase caducó: no la arrastramos desde localStorage.
        state.session = null;
        localStorage.removeItem('fuga_session');
      }
      sb.auth.onAuthStateChange((event, s) => {
        if (s && (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED')) {
          const next = sessionFromSupabase(s);
          const same = state.session && state.session.provider === 'supabase' && state.session.email === next.email;
          state.session = next;
          saveSession();
          if (!same) { state.view = 'dashboard'; render(); }
        } else if (event === 'SIGNED_OUT' && state.session && state.session.provider === 'supabase') {
          state.session = null;
          localStorage.removeItem('fuga_session');
          render();
        }
      });
    } catch (e) { /* sin nube: la consola sigue funcionando en local */ }
  }
  // Prefill desde la demo vulnerable: /app.html#demo=medicloud
  if (location.hash.indexOf('demo=medicloud') !== -1) {
    if (!state.session) { state.session = { email: 'demo@fuga.dev', name: 'Usuario Demo', provider: 'demo' }; saveSession(); }
    state.wizard = { step: 3, backend: 'firestore', name: 'MediCloud', rules: MEDICLOUD_RULES, code: MEDICLOUD_CODE };
    state.view = 'new-scan';
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }
  render();
}
boot();
</script>
